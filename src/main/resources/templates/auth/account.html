<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container-fluid px-4">
        <span class="navbar-brand fw-bold">
            <i class="bi bi-hospital-fill me-2"></i>Phòng Khám Đức Thịnh
        </span>
        <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">
            <i class="bi bi-box-arrow-right me-1"></i>Đăng xuất
        </a>
    </div>
</nav>
<div class="container py-5">
    <div class="card border-0 shadow-sm mx-auto" style="max-width: 480px;">
        <div class="card-body p-4 text-center">
            <i class="bi bi-person-check text-success" style="font-size: 3rem;"></i>
            <h5 class="mt-3 mb-2">Xin chào, <span th:text="${loggedUser.fullName}">Bệnh nhân</span></h5>
            <p class="text-muted small mb-4">Tài khoản bệnh nhân đã được kích hoạt.</p>
            <p class="small text-muted">Các chức năng đặt lịch chưa bật trong module hiện tại.</p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
