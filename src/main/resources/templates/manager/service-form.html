<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${isEdit} ? 'Sửa Dịch Vụ' : 'Thêm Dịch Vụ Mới'">Form Dịch Vụ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" th:href="@{/manager/home}">
            <i class="bi bi-hospital-fill me-2"></i>Phòng Khám Đức Thịnh
        </a>
        <div class="d-flex align-items-center gap-2">
            <span class="text-white small">
                <i class="bi bi-person-badge me-1"></i>
                <span th:text="${loggedUser?.fullName}"></span>
            </span>
            <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">
                <i class="bi bi-box-arrow-right"></i>
            </a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/manager/home}">Trang chủ</a></li>
            <li class="breadcrumb-item"><a th:href="@{/manager/services}">Quản lý dịch vụ</a></li>
            <li class="breadcrumb-item active" th:text="${isEdit} ? 'Sửa dịch vụ' : 'Thêm mới'"></li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-plus-circle me-2"
                           th:classappend="${isEdit} ? ' d-none' : ''"></i>
                        <i class="bi bi-pencil-fill me-2"
                           th:classappend="${!isEdit} ? ' d-none' : ''"></i>
                        <span th:text="${isEdit} ? 'Cập Nhật Dịch Vụ' : 'Thêm Dịch Vụ / Xét Nghiệm Mới'"></span>
                    </h5>
                </div>
                <div class="card-body p-4" id="serviceFormRoot"
                     th:attr="data-add-only=${!isEdit}">

                    <div th:if="${!isEdit}" class="mb-4">
                        <label class="form-label fw-bold">
                            <i class="bi bi-list-check me-1"></i>Loại dịch vụ <span class="text-danger">*</span>
                        </label>
                        <div class="d-flex gap-3">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="serviceKindSelector"
                                       id="kindGeneral" value="GENERAL" checked
                                       onchange="switchForm('GENERAL')"/>
                                <label class="form-check-label" for="kindGeneral">
                                    <i class="bi bi-stethoscope me-1 text-info"></i>Khám thông thường
                                </label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="serviceKindSelector"
                                       id="kindTest" value="TEST"
                                       onchange="switchForm('TEST')"/>
                                <label class="form-check-label" for="kindTest">
                                    <i class="bi bi-eyedropper me-1 text-warning"></i>Xét nghiệm
                                </label>
                            </div>
                        </div>
                    </div>

                    <div th:if="${isEdit}" class="mb-3">
                        <span th:if="${serviceKind == 'GENERAL'}" class="badge bg-info text-dark fs-6">
                            <i class="bi bi-stethoscope me-1"></i>Dịch vụ Khám thông thường
                        </span>
                        <span th:if="${serviceKind == 'TEST'}" class="badge bg-warning text-dark fs-6">
                            <i class="bi bi-eyedropper me-1"></i>Dịch vụ Xét nghiệm
                        </span>
                    </div>

                    <form id="formGeneral"
                          th:if="${!isEdit or serviceKind == 'GENERAL'}"
                          th:object="${generalService}"
                          th:action="${isEdit} ? @{/manager/services/general/update/{id}(id=${editId})} : @{/manager/services/general/add}"
                          method="post">

                        <input type="hidden" th:field="*{type}"/>

                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label fw-semibold">
                                    Tên dịch vụ <span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control" th:field="*{name}" required
                                       placeholder="Nhập tên dịch vụ..."/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">
                                    Giá (₫) <span class="text-danger">*</span>
                                </label>
                                <input type="number" class="form-control" th:field="*{price}" required min="0" step="1000"
                                       placeholder="0"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Phân loại</label>
                                <div class="form-control bg-light border py-2 px-3 rounded">
                                    <span class="text-body">Khám thông thường</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Phòng khám</label>
                                <select name="clinicId" class="form-select">
                                    <option value="">-- Chọn phòng khám --</option>
                                    <option th:each="c : ${clinics}"
                                            th:value="${c.id}"
                                            th:text="${c.name}"
                                            th:selected="${generalService.clinic != null and generalService.clinic.id == c.id}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Mô tả</label>
                                <textarea class="form-control" th:field="*{des}" rows="3"
                                          placeholder="Mô tả chi tiết về dịch vụ..."></textarea>
                            </div>
                            <div class="col-12">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" th:field="*{active}"
                                           id="isActiveChkGeneral"/>
                                    <label class="form-check-label" for="isActiveChkGeneral">
                                        <strong>Đang hoạt động</strong>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-save me-1"></i>
                                <span th:text="${isEdit} ? 'Cập nhật' : 'Thêm mới'"></span>
                            </button>
                            <a th:href="@{/manager/services}" class="btn btn-outline-secondary px-4">
                                <i class="bi bi-x-circle me-1"></i>Hủy
                            </a>
                        </div>
                    </form>

                    <form id="formTest"
                          th:if="${!isEdit or serviceKind == 'TEST'}"
                          th:object="${testService}"
                          th:action="${isEdit} ? @{/manager/services/test/update/{id}(id=${editId})} : @{/manager/services/test/add}"
                          method="post"
                          th:classappend="${!isEdit} ? ' d-none' : ''">

                        <input type="hidden" th:field="*{type}"/>

                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label fw-semibold">
                                    Tên xét nghiệm <span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control" th:field="*{name}" required
                                       placeholder="Nhập tên xét nghiệm..."/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">
                                    Giá (₫) <span class="text-danger">*</span>
                                </label>
                                <input type="number" class="form-control" th:field="*{price}" required min="0" step="1000"
                                       placeholder="0"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Phân loại</label>
                                <div class="form-control bg-light border py-2 px-3 rounded">
                                    <span class="text-body">Xét nghiệm</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Phòng khám</label>
                                <select name="clinicId" class="form-select">
                                    <option value="">-- Chọn phòng khám --</option>
                                    <option th:each="c : ${clinics}"
                                            th:value="${c.id}"
                                            th:text="${c.name}"
                                            th:selected="${testService.clinic != null and testService.clinic.id == c.id}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Mô tả</label>
                                <textarea class="form-control" th:field="*{des}" rows="2"
                                          placeholder="Mô tả về xét nghiệm..."></textarea>
                            </div>

                            <div class="col-12">
                                <div class="card border-warning bg-warning bg-opacity-10">
                                    <div class="card-header bg-warning bg-opacity-25 py-2">
                                        <small class="fw-bold text-warning-emphasis">
                                            <i class="bi bi-clipboard2-check me-1"></i>Thông tin xét nghiệm
                                        </small>
                                    </div>
                                    <div class="card-body">
                                        <div class="mb-3">
                                            <label class="form-label fw-semibold">
                                                <i class="bi bi-list-task me-1"></i>Hướng dẫn chuẩn bị
                                            </label>
                                            <textarea class="form-control" th:field="*{preparationInstructions}" rows="3"
                                                      placeholder="VD: Nhịn ăn 8 tiếng, uống nhiều nước lọc..."></textarea>
                                        </div>
                                        <div>
                                            <label class="form-label fw-semibold">
                                                <i class="bi bi-gear me-1"></i>Phương pháp thực hiện
                                            </label>
                                            <input type="text" class="form-control" th:field="*{method}"
                                                   placeholder="VD: Lấy máu tĩnh mạch, phân tích bằng máy tự động..."/>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-save me-1"></i>
                                <span th:text="${isEdit} ? 'Cập nhật' : 'Thêm mới'"></span>
                            </button>
                            <a th:href="@{/manager/services}" class="btn btn-outline-secondary px-4">
                                <i class="bi bi-x-circle me-1"></i>Hủy
                            </a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-2 mt-4">
    <small>© 2026 Phòng Khám Tư Nhân Đức Thịnh</small>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function switchForm(kind) {
        const fg = document.getElementById('formGeneral');
        const ft = document.getElementById('formTest');
        if (fg) {
            fg.classList.toggle('d-none', kind !== 'GENERAL');
        }
        if (ft) {
            ft.classList.toggle('d-none', kind !== 'TEST');
        }
    }
    document.addEventListener('DOMContentLoaded', function () {
        const root = document.getElementById('serviceFormRoot');
        var addOnly = root && root.getAttribute('data-add-only') === 'true';
        if (addOnly) {
            switchForm('GENERAL');
        }
    });
</script>
</body>
</html>
