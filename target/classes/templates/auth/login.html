<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đăng Nhập - Phòng Khám Đức Thịnh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <i class="bi bi-hospital-fill text-primary" style="font-size:3rem;"></i>
                <h3 class="fw-bold mt-2 text-primary">Phòng Khám Đức Thịnh</h3>
                <p class="text-muted">Hệ thống quản lý phòng khám tư nhân</p>
            </div>

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4">
                    <h5 class="card-title text-center mb-4">
                        <i class="bi bi-lock-fill me-2 text-primary"></i>Đăng Nhập
                    </h5>

                    <div th:if="${error}" class="alert alert-danger py-2">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-person me-1"></i>Tên đăng nhập
                            </label>
                            <input type="text" name="username" class="form-control"
                                   placeholder="Nhập tên đăng nhập" required autofocus/>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-key me-1"></i>Mật khẩu
                            </label>
                            <input type="password" name="password" class="form-control"
                                   placeholder="Nhập mật khẩu" required/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Đăng Nhập
                        </button>
                    </form>
                </div>
            </div>

            <p class="text-center text-muted mt-3">
                <small>© 2026 Phòng Khám Tư Nhân Đức Thịnh</small>
            </p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
