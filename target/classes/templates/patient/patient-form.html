<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Thông Tin Bệnh Nhân - Phòng Khám Đức Thịnh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-success shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/patient/home}">
            <i class="bi bi-hospital-fill me-2"></i>Phòng Khám Đức Thịnh
        </a>
        <div class="d-flex align-items-center gap-2">
            <span class="text-white small" th:text="${loggedUser?.fullName}"></span>
            <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">
                <i class="bi bi-box-arrow-right"></i>
            </a>
        </div>
    </div>
</nav>

<div class="container py-4">

    <!-- Progress Steps -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body py-3">
            <div class="d-flex justify-content-between align-items-center">
                <div class="text-center flex-fill">
                    <div class="rounded-circle bg-success text-white d-inline-flex align-items-center justify-content-center"
                         style="width:36px;height:36px;"><i class="bi bi-check-lg"></i></div>
                    <div class="small text-success mt-1">Chọn dịch vụ</div>
                </div>
                <div class="flex-fill"><hr class="border-success border-2"/></div>
                <div class="text-center flex-fill">
                    <div class="rounded-circle bg-success text-white d-inline-flex align-items-center justify-content-center"
                         style="width:36px;height:36px;"><i class="bi bi-check-lg"></i></div>
                    <div class="small text-success mt-1">Chọn bác sĩ & lịch</div>
                </div>
                <div class="flex-fill"><hr class="border-success border-2"/></div>
                <div class="text-center flex-fill">
                    <div class="rounded-circle bg-success text-white d-inline-flex align-items-center justify-content-center fw-bold"
                         style="width:36px;height:36px;"><span>3</span></div>
                    <div class="small fw-bold text-success mt-1">Thông tin bệnh nhân</div>
                </div>
                <div class="flex-fill"><hr/></div>
                <div class="text-center flex-fill">
                    <div class="rounded-circle bg-secondary text-white d-inline-flex align-items-center justify-content-center fw-bold"
                         style="width:36px;height:36px;"><span>4</span></div>
                    <div class="small text-muted mt-1">Xác nhận</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Summary Banner -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card border-success border-opacity-25 bg-success bg-opacity-10 h-100">
                <div class="card-body py-2 px-3">
                    <small class="text-muted d-block">Dịch vụ</small>
                    <strong th:text="${selectedService?.name}"></strong>
                    <div class="text-success fw-bold small"
                         th:text="${#numbers.formatDecimal(selectedService?.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-success border-opacity-25 bg-success bg-opacity-10 h-100">
                <div class="card-body py-2 px-3">
                    <small class="text-muted d-block">Bác sĩ</small>
                    <strong th:text="${selectedDoctor?.name}"></strong>
                    <div class="text-muted small"
                         th:text="${selectedDoctor?.specialization != null ? selectedDoctor.specialization.name : selectedDoctor?.major}"></div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-success border-opacity-25 bg-success bg-opacity-10 h-100">
                <div class="card-body py-2 px-3">
                    <small class="text-muted d-block">Lịch hẹn</small>
                    <strong th:text="${#temporals.format(selectedDate, 'dd/MM/yyyy')}"></strong>
                    <div class="text-muted small" th:text="'Giờ: ' + ${selectedTime}"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-person-fill me-2"></i>Bước 3: Nhập Thông Tin Bệnh Nhân
                    </h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/patient/booking/submit-patient}" method="post">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label fw-semibold">
                                    Họ và tên <span class="text-danger">*</span>
                                </label>
                                <input type="text" name="name" class="form-control" required
                                       placeholder="Nhập họ và tên đầy đủ..."/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Số điện thoại</label>
                                <input type="tel" name="telNumber" class="form-control"
                                       placeholder="0901234567"/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Ngày sinh</label>
                                <input type="date" name="dateOfBirth" class="form-control"/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Giới tính</label>
                                <div class="d-flex gap-3 mt-1">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="gender"
                                               id="genderMale" value="Nam" checked/>
                                        <label class="form-check-label" for="genderMale">Nam</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="gender"
                                               id="genderFemale" value="Nữ"/>
                                        <label class="form-check-label" for="genderFemale">Nữ</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="gender"
                                               id="genderOther" value="Khác"/>
                                        <label class="form-check-label" for="genderOther">Khác</label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" name="email" class="form-control"
                                       placeholder="email@example.com"/>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Ghi chú / Triệu chứng</label>
                                <textarea name="note" class="form-control" rows="2"
                                          placeholder="Mô tả triệu chứng, lý do khám..."></textarea>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Tiền sử dị ứng</label>
                                <input type="text" name="allergies" class="form-control"
                                       placeholder="VD: Dị ứng Penicillin... (để trống nếu không có)"/>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-success px-4">
                                <i class="bi bi-arrow-right me-1"></i>Tiếp tục
                            </button>
                            <a th:href="@{/patient/booking/schedule}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Quay lại
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-2 mt-4">
    <small>© 2026 Phòng Khám Tư Nhân Đức Thịnh</small>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
