<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Chọn Dịch Vụ - Phòng Khám Đức Thịnh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-success shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/patient/home}">
            <i class="bi bi-hospital-fill me-2"></i>Phòng Khám Đức Thịnh
        </a>
        <div class="d-flex align-items-center gap-2">
            <span class="text-white small" th:text="${loggedUser?.fullName}"></span>
            <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">
                <i class="bi bi-box-arrow-right"></i>
            </a>
        </div>
    </div>
</nav>

<div class="container py-4">

    <!-- Progress Steps -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body py-3">
            <div class="d-flex justify-content-between align-items-center">
                <div class="text-center flex-fill">
                    <div class="step-circle bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center"
                         style="width:36px;height:36px;">
                        <span class="fw-bold">1</span>
                    </div>
                    <div class="small fw-bold text-success mt-1">Chọn dịch vụ</div>
                </div>
                <div class="flex-fill"><hr class="border-2"/></div>
                <div class="text-center flex-fill">
                    <div class="step-circle bg-secondary text-white rounded-circle d-inline-flex align-items-center justify-content-center"
                         style="width:36px;height:36px;">
                        <span class="fw-bold">2</span>
                    </div>
                    <div class="small text-muted mt-1">Chọn bác sĩ & lịch</div>
                </div>
                <div class="flex-fill"><hr/></div>
                <div class="text-center flex-fill">
                    <div class="step-circle bg-secondary text-white rounded-circle d-inline-flex align-items-center justify-content-center"
                         style="width:36px;height:36px;">
                        <span class="fw-bold">3</span>
                    </div>
                    <div class="small text-muted mt-1">Thông tin bệnh nhân</div>
                </div>
                <div class="flex-fill"><hr/></div>
                <div class="text-center flex-fill">
                    <div class="step-circle bg-secondary text-white rounded-circle d-inline-flex align-items-center justify-content-center"
                         style="width:36px;height:36px;">
                        <span class="fw-bold">4</span>
                    </div>
                    <div class="small text-muted mt-1">Xác nhận</div>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">
            <i class="bi bi-grid-3x3-gap me-2 text-success"></i>Bước 1: Chọn Dịch Vụ / Xét Nghiệm
        </h5>
        <small class="text-muted" th:text="'Tổng: ' + ${servicePage.totalElements} + ' dịch vụ'"></small>
    </div>

    <!-- Search -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/patient/booking/services}" method="get" class="row g-2 align-items-end">
                <div class="col-md-5">
                    <input type="text" name="keyword" class="form-control"
                           placeholder="Tìm dịch vụ theo tên..."
                           th:value="${keyword}"/>
                </div>
                <div class="col-md-3">
                    <select name="type" class="form-select">
                        <option value="">-- Tất cả loại --</option>
                        <option value="GENERAL" th:selected="${type == 'GENERAL'}">Khám thông thường</option>
                        <option value="TEST" th:selected="${type == 'TEST'}">Xét nghiệm</option>
                    </select>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-search me-1"></i>Tìm
                    </button>
                </div>
                <div class="col-auto">
                    <a th:href="@{/patient/booking/services}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-counterclockwise"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Services Grid -->
    <div class="row g-3">
        <div th:if="${#lists.isEmpty(services)}" class="col-12">
            <div class="text-center py-5 text-muted">
                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                Không tìm thấy dịch vụ phù hợp.
            </div>
        </div>

        <div th:each="svc : ${services}" class="col-md-4 col-lg-3">
            <div class="card h-100 border-0 shadow-sm service-card">
                <div class="card-body d-flex flex-column">
                    <div class="mb-2">
                        <span th:if="${svc.type == 'GENERAL'}"
                              class="badge bg-info text-dark mb-2">
                            <i class="bi bi-stethoscope me-1"></i>Khám bệnh
                        </span>
                        <span th:if="${svc.type == 'TEST'}"
                              class="badge bg-warning text-dark mb-2">
                            <i class="bi bi-eyedropper me-1"></i>Xét nghiệm
                        </span>
                    </div>
                    <h6 class="fw-bold" th:text="${svc.name}"></h6>
                    <p class="text-muted small flex-grow-1"
                       th:text="${#strings.abbreviate(svc.des, 80)}"></p>

                    <!-- TestService extra info -->
                    <div th:if="${svc.type == 'TEST'}"
                         class="bg-warning bg-opacity-10 rounded p-2 mb-2 small">
                        <strong>Chuẩn bị:</strong>
                        <span th:text="${#strings.abbreviate(svc.preparationInstructions, 60)}"></span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <span class="text-success fw-bold"
                              th:text="${#numbers.formatDecimal(svc.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span>
                        <form th:action="@{/patient/booking/select-service}" method="post">
                            <input type="hidden" name="serviceId" th:value="${svc.id}"/>
                            <button type="submit" class="btn btn-success btn-sm">
                                <i class="bi bi-arrow-right me-1"></i>Chọn
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${servicePage.totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${servicePage.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/patient/booking/services(keyword=${keyword},type=${type},page=${currentPage - 1})}">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>
            <li th:each="i : ${#numbers.sequence(0, servicePage.totalPages - 1)}"
                class="page-item" th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/patient/booking/services(keyword=${keyword},type=${type},page=${i})}"
                   th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${servicePage.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/patient/booking/services(keyword=${keyword},type=${type},page=${currentPage + 1})}">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>

    <!-- Navigation -->
    <div class="mt-3">
        <a th:href="@{/patient/home}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Quay lại trang chủ
        </a>
    </div>
</div>

<footer class="bg-dark text-white text-center py-2 mt-4">
    <small>© 2026 Phòng Khám Tư Nhân Đức Thịnh</small>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
